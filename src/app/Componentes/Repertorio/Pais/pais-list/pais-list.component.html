<div class="inicio-card input-group flex-nowrap">
  <a class="btn btn-primary" [routerLink]="['agregar']" *ngIf="permiso.puedeCrear(Seccion.Pais)">Agregar</a>
  <span class="input-group-text" id="addon-wrapping"><i class="fa-solid fa-magnifying-glass"></i></span>
  <input *ngIf="!tabla" #inputMaterial matInput placeholder="Buscar" class="form-control bg-dark text-white mb-2"
    (keyup)="applyFilter($event)" autofocus>

  <input *ngIf="tabla" type="text" class="form-control bg-dark text-white mb-2" placeholder="Buscar"
    [(ngModel)]="search" autofocus>

  <a *ngIf="tabla" type="button" class="btn btn-light" (click)="cambiarVista()">
    <i class="fa-solid fa-list"></i>
  </a>
  <a *ngIf="!tabla" type="button" class="btn btn-light" (click)="cambiarVista()">
    <i class="fa-solid fa-table"></i>
  </a>

  <!-- Exportar -->
  <app-export-button [action]="export.bind(this)" color="success" [outline]="true"
    extraClass="me-2"></app-export-button>
</div>

<label *ngIf="tabla">Total: {{ (Paises | customGlobalFilter:search).length }} registros</label>

<div class="container-scroll row" [hidden]="!tabla">
  <div class="col-md-4" *ngFor="let dato of Paises | customGlobalFilter:search" style="margin-bottom: 1.5rem;">
    <div class="card text-center">
      <div class="card-header text-white d-flex justify-content-between align-items-center"
        [ngStyle]="{ 'border': show ? 'none' : '' }">
        {{dato.nombre}}

        <div class="btn-group" role="group" aria-label="Basic mixed styles example">
          <button *ngIf="permiso.puedeEliminar(Seccion.Pais)" class="btn btn-danger" (click)="borrar(dato.paisId)">
            <i class="far fa-trash-alt"></i>
          </button>

          <button *ngIf="!show" class="btn btn-primary" (click)="show = !show">
            <i class="fa-solid fa-circle-info"></i>
          </button>
          <button *ngIf="show" class="btn btn-primary" (click)="show = !show">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>
      <div class="box">
        <img [src]="dato.bandera == '' ? '/assets/noImagen.png' : dato.bandera " alt="Imagen del País" loading="lazy"
          (error)="funciones.imagenNoValida($event)" loading="lazy">
      </div>
      <div class="card-body" *ngIf="show">
        <p style="font-weight: bold;">Nacionalidad</p>
        <p>{{dato.nacionalidad}}</p>
        <p style="font-weight: bold;">Continente</p>
        <p>{{dato.continente}}</p>

        <div class="btn-group" role="group" aria-label="Basic mixed styles example">
          <a *ngIf="permiso.puedeEditar(Seccion.Pais)" [routerLink]="['actualizar', dato.paisId]"
            class="btn btn-info btn-block"><i class="fa-solid fa-pen-to-square"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Tabla -->
<div [hidden]="tabla">
  <div class="container-scroll">
    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="paisId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
          <td mat-cell *matCellDef="let dato">{{ dato.paisId }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let dato">{{ dato.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="nacionalidad">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nacionalidad</th>
          <td mat-cell *matCellDef="let dato">{{ dato.nacionalidad }}</td>
        </ng-container>

        <ng-container matColumnDef="continente">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Continente</th>
          <td mat-cell *matCellDef="let dato">{{ dato.continente }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let dato">
            <div class="btn-group" role="group" aria-label="Basic mixed styles example">
              <a *ngIf="permiso.puedeEditar(Seccion.Pais)" [routerLink]="['actualizar', dato.paisId]"
                class="btn btn-info btn-block"><i class="fa-solid fa-pen-to-square"></i>
              </a>

              <button *ngIf="permiso.puedeEliminar(Seccion.Pais)" class="btn btn-danger" (click)="borrar(dato.paisId)">
                <i class="far fa-trash-alt"></i>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <p *ngIf="dataSource.data.length === 0" class="text-center">No hay países registrados.</p>
    </div>
  </div>
  <div class="paginator-container">
    <mat-paginator [pageSize]="pageSize"></mat-paginator>
  </div>
</div>
